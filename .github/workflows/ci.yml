name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly, to catch changes in Perpl, Propel2 and Symfony without a push
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  tests:
    name: "PHP ${{ matrix.php-version }} - Symfony ${{ matrix.symfony-version }} - ${{ matrix.orm }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2', '8.3', '8.4', '8.5' ]
        symfony-version: [ '7.4.*', '8.*' ]
        orm: [ 'perpl', 'propel' ]
        exclude:
          # Symfony 8 requires PHP 8.4
          - php-version: '8.2'
            symfony-version: '8.*'
          - php-version: '8.3'
            symfony-version: '8.*'
          # propel/propel does not support Symfony 8 yet
          - orm: 'propel'
            symfony-version: '8.*'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: flex

      - name: Use propel/propel instead of Perpl
        if: matrix.orm == 'propel'
        run: composer remove --dev --no-update perplorm/perpl

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony-version }}

      - name: Run tests
        run: vendor/bin/phpunit

  phpstan:
    name: "PHPStan - ${{ matrix.orm }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        orm: [ 'perpl', 'propel' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Use propel/propel instead of Perpl
        if: matrix.orm == 'propel'
        run: composer remove --dev --no-update perplorm/perpl

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHP_CodeSniffer
        run: composer cs-check

  status:
    name: Status
    if: always()
    needs: [ tests, phpstan, code-style ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
